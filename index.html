<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>Unburden</title>
<meta name="description" content="Unburden." />

<style>
  :root {
    --bg: #f6f5f2;          /* soft off-white */
    --text: #2a2a2a;        /* neutral dark */
    --muted: #6f6f6f;
    --accent: #0f8a78;      /* green-teal */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }

  .wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }

  .container {
    width: 100%;
    max-width: 620px;
  }

  h1 {
    margin: 0 0 20px;
    font-size: clamp(44px, 8vw, 84px);
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 0.95;
    color: var(--accent);
  }

  p {
    margin: 0 0 18px;
    font-size: 18px;
    color: var(--muted);
    max-width: 48ch;
  }

  .email {
    margin-top: 26px;
    display: inline-block;
    color: var(--text);
    text-decoration: none;
    border-bottom: 1px solid rgba(0,0,0,0.15);
    padding-bottom: 2px;
    transition: opacity 0.2s ease;
  }

  .email:hover {
    opacity: 0.6;
  }

  footer {
    margin-top: 44px;
    font-size: 13px;
    color: #9a9a9a;
  }
</style>
</head>

<body>
  <div class="wrap">
    <main class="container">
      <h1>Unburden</h1>

      <p>
        We’re working quietly.
      </p>

      <p>
        More when it’s ready.
      </p>

      <a class="email" href="mailto:amedeo@unburden.bio">
        amedeo@unburden.bio
      </a>

      <footer>
        © <span id="year"></span> Unburden
      </footer>
    </main>
  </div>

<script>
  document.getElementById("year").textContent =
    new Date().getFullYear();
</script>
</body>
</html>
