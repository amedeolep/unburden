<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>Unburden</title>
<meta name="description" content="Unburden." />

<style>
  :root {
    --bg: #f6f5f2;
    --text: #2a2a2a;
    --muted: #6f6f6f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }

  .wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }

  .container {
    width: 100%;
    max-width: 620px;
  }

  .logo {
    width: min(320px, 70vw);
    height: auto;
    display: block;
    margin-bottom: 28px;
  }

  p {
    margin: 0 0 14px;
    font-size: 18px;
    color: var(--muted);
    max-width: 48ch;
  }

  .email {
    margin-top: 24px;
    display: inline-block;
    color: var(--text);
    text-decoration: none;
    border-bottom: 1px solid rgba(0,0,0,0.15);
    padding-bottom: 2px;
    transition: opacity 0.2s ease;
  }

  .email:hover {
    opacity: 0.6;
  }

  footer {
    margin-top: 44px;
    font-size: 13px;
    color: #9a9a9a;
  }
</style>
</head>

<body>
  <div class="wrap">
    <main class="container">

      <!-- Replace logo.png with your actual file name -->
      <img src="logo.png" alt="Unburden" class="logo" />

      <p>We’re building it.</p>
      <p>More when it’s ready.</p>

      <a class="email" href="mailto:amedeo@unburden.bio">
        amedeo@unburden.bio
      </a>

      <footer>
        © <span id="year"></span> Unburden
      </footer>
    </main>
  </div>

<script>
  document.getElementById("year").textContent =
    new Date().getFullYear();
</script>
</body>
</html>
